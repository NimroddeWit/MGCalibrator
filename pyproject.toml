[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "MGCalibrator"
version = "1.1.0"
description = "CLI tool for computing absolute abundances in metagenomic data (BAM files, SingleM + FASTQ, or Sylph + FASTQ)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Nimrod de Wit", email = "nimrod.de.wit@rivm.nl" }
]
keywords = ["metagenomics", "absolute quantification", "microbiome", "SingleM", "Sylph"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Intended Audience :: Science/Research"
]
dependencies = [
    "pandas>=1.5",
    "numpy>=1.24",
    "pysam>=0.20"
]

[project.optional-dependencies]
test = ["pytest"]

[project.urls]
Homepage = "https://github.com/NimroddeWit/MGCalibrator"
Documentation = "https://github.com/NimroddeWit/MGCalibrator/blob/main/README.md"
Source = "https://github.com/NimroddeWit/MGCalibrator"

[project.scripts]
mgcalibrator = "MGCalibrator.cli:main"

[tool.setuptools.packages.find]
include = ["MGCalibrator*"]
